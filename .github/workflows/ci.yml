name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ driver
        uses: actions/checkout@v4

      - name: Checkout KoutenDB core
        uses: actions/checkout@v4
        with:
          repository: puffball1567/koutendb
          path: koutendb-core

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake g++

      - name: Build KoutenDB C ABI
        run: |
          cd koutendb-core
          nimble install -y
          nim c --app:lib -d:release --nimcache:/tmp/nimcache_kouten_capi -o:lib/libkoutendb.so src/koutendb_capi.nim

      - name: Configure CMake
        run: cmake -S . -B build -DKOUTENDB_CORE_DIR="${{ github.workspace }}/koutendb-core"

      - name: Build smoke
        run: cmake --build build --verbose

      - name: Run smoke
        run: ./build/koutendb_cpp_contract_smoke
